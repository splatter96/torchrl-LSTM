
# task and env
env:
  #name: CartPole-v1
  name: merge-single-agent-v0
  task: ""
  library: gym
  seed: 42
  max_episode_steps: 500

  config:
     duration: 15
     policy_frequency: 5
     simulation_frequency: 15
     merging_speed_reward: -0.5
     right_lane_reward: 0.1
     reward_speed_range: [10, 30]
     collision_reward: 200
     high_speed_reward: 1
     safety_guarantee: false
     traffic_density: 3
     offramp_reward: 100
     lane_change_reward: -0.05
     #MERGING_LANE_COST: 0
     #LANE_CHANGE_COST: 4
     #HEADWAY_COST: 4
     dutycycle: 15

# collector
collector:
  #total_frames: 250000
  total_frames: 2000000
  init_random_frames: 1000
  init_env_steps: 1000
  frames_per_batch: 1000
  reset_at_each_iter: False
  device: null
  env_per_collector: 1
  num_workers: 1

# replay buffer
replay_buffer:
  prb: 0 # use prioritized experience replay
  size: 500000
  scratch_dir: null

# optim
optim:
  utd_ratio: 0.25
  gamma: 0.99
  batch_size: 256
  lr: 5e-4
  weight_decay: 0.0
  target_update_polyak: 0.995
  #target_entropy_weight: 0.98
  target_entropy_weight: 0.2
  # default is 0.98 but needs to be decreased for env
  # with small action space
  target_entropy: "auto"
  loss_function: l2
  clipping_norm: 30

# network
network:
  hidden_sizes: [256, 256]
  activation: relu
  device: null

# logging
logger:
  backend: wandb
  project_name: torchrl_highway_env
  group_name: null
  exp_name: ${env.name}_lidar_with_interference_with_curriculum_one_frame_enough
  mode: online
  eval_iter: 5000
  video: False
