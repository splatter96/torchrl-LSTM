
# task and env
env:
  name: merge-single-agent-v0
  task: ""
  library: gym
  seed: 42
  max_episode_steps: 500
  config:
    duration: 15
    policy_frequency: 5
    merging_speed_reward: -0.5
    right_lane_reward: 0.1
    lane_change_reward: -0.05
    reward_speed_range: [10, 30]
    collision_reward: 200
    high_speed_reward: 2
    safety_guarantee: false
    traffic_density: 1
    offramp_reward: 100
    dutycycle: [1,2]

# collector
collector:
  total_frames: 75000
  init_random_frames: 1000
  init_env_steps: 1000
  frames_per_batch: 50
  reset_at_each_iter: False
  device: null
  env_per_collector: 1
  num_workers: 1

# replay buffer
replay_buffer:
  prb: 0 # use prioritized experience replay
  size: 1000000
  scratch_dir: null

# optim
optim:
  utd_ratio: 1.0
  gamma: 0.99
  batch_size: 16
  lr: 5.0e-4
  weight_decay: 0.0
  target_update_polyak: 0.995
  target_entropy_weight: 0.2
  target_entropy: "auto"
  loss_function: l2
  # default is 0.98 but needs to be decreased for env
  # with small action space

# network
network:
  hidden_sizes: [128, 128]
  activation: relu
  device: null

# logging
logger:
  backend: wandb
  project_name: torchrl_highwayenv
  group_name: null
  exp_name: ${env.name}_DiscreteSAC
  mode: online
  eval_iter: 1000
  video: False

eval:
  checkpoint: "agent_final_01-30:21-42:33.50"
